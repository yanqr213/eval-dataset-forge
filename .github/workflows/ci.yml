name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Validate example
        run: |
          python -m pip install -e .
          eval-dataset-forge validate examples/basic.json
          eval-dataset-forge build examples/basic.csv -o outputs/basic.jsonl --shuffle --seed 123
          eval-dataset-forge stats examples/basic.json
